[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "listrot"
version = "0.1.0"
description = "Checks every GitHub repo linked in an awesome-list (or any markdown list) for dead links, archived repos, staleness, and suspicious star growth."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Sujeet Yadav"}]
dependencies = [
    "requests>=2.31",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/codesujeet/listrot"
Repository = "https://github.com/codesujeet/listrot"
Issues = "https://github.com/codesujeet/listrot/issues"

[project.scripts]
listrot = "listrot.cli:main"

[tool.setuptools.packages.find]
include = ["listrot*"]
